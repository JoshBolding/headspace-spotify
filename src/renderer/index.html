<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Headspace</title>
    <!-- unsafe-eval / wasm-unsafe-eval: butterchurn compiles Milkdrop presets via new Function(); the SDK decrypts with wasm. file: keeps file:// loads working. Extra scdn/spotifycdn/akamai hosts are the album-art + stream CDNs the SDK already uses. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file: 'unsafe-eval' 'wasm-unsafe-eval' https://sdk.scdn.co; style-src 'self' file:; img-src 'self' file: data: blob: https://i.scdn.co https://*.scdn.co https://*.spotifycdn.com; media-src blob: https://*.scdn.co https://*.spotify.com https://*.spotifycdn.com https://*.akamaized.net; connect-src 'self' https://*.spotify.com https://*.scdn.co https://*.spotifycdn.com https://*.akamaized.net wss://*.spotify.com wss://*.scdn.co; frame-src https://sdk.scdn.co; worker-src 'self' blob:" />
    <link rel="stylesheet" href="./skin.css" />
  </head>
  <body>
    <div id="stage">
      <!-- Ears: behind head, slide on toggle -->
      <div class="ear-container" id="eq-ear">
        <div class="drawer-body" id="eq-drawer-body">
          <div id="eq-panel"></div>
        </div>
        <img class="drawer-edge" id="eq-edge" src="left_drawer_right.png" alt="" />
        <img class="ear-img" src="right_ear.png" alt="" />
        <!-- Speaker cone canvas (sprite-sliced cones with spring physics) is
             created at runtime by SpeakerRig and appended here, layered over
             the painted speakers. -->
        <button class="ear-handle" id="btn-eq-handle" title="Open equalizer"></button>
      </div>
      <div class="ear-container" id="pl-ear">
        <div class="drawer-body" id="pl-drawer-body"></div>
        <img class="drawer-edge" id="pl-edge" src="right_drawer_left.png" alt="" />
        <img class="ear-img" src="right_ear.png" alt="" />
        <!-- Speaker cone canvas created at runtime by SpeakerRig. -->
        <button class="ear-handle" id="btn-pl-handle" title="Open playlist"></button>
      </div>

      <!-- Head + glowing eyes wrapped in a transform group so face-alive's
           sway/tilt animations move them together (eyes stay locked to face). -->
      <div id="head-group">
        <img id="head" src="head.png" alt="" />
        <div id="alive-head-light"></div>
        <!-- Procedural canvas eyes. Each canvas draws head.png's own pixels
             as its base (seamless), then a procedural eyeball + curved lids
             on top. Rendered by AliveEyeRig. -->
        <div id="alive-eye-layer">
          <canvas id="alive-eye-left" class="alive-eye"></canvas>
          <canvas id="alive-eye-right" class="alive-eye"></canvas>
        </div>
      </div>
      <div id="drag"></div>
      <!-- Easter-egg trigger: invisible nose hitbox, 5 clicks → toggle -->
      <div id="nose-hitbox" data-opaque="1"></div>

      <!-- Face-screen visualizer -->
      <canvas id="vis-canvas"></canvas>
      <!-- Milkdrop (butterchurn) WebGL canvas — shown only in milkdrop mode,
           masked to the screen interior like #vis-canvas. -->
      <canvas id="butterchurn-canvas"></canvas>
      <div id="milkdrop-hint">♪ play audio for Milkdrop</div>
      <!-- Transparent hit layer over the screen so right-clicks register there
           (the screen cutout is otherwise click-through). Hosts the visualizer
           context menu. -->
      <div id="vis-hit" data-opaque="1" aria-hidden="true"></div>
      <div id="vis-context-menu" data-opaque="1" aria-hidden="true"></div>
      <div id="vis-mode-label"></div>
      <div id="lyrics-overlay">
        <div class="ly-prev" id="ly-prev"></div>
        <div class="ly-current" id="ly-current"></div>
        <div class="ly-next" id="ly-next"></div>
      </div>
      <button id="btn-theme-toggle" data-opaque="1" title="Cycle theme">THEME</button>
      <button id="btn-lyrics-toggle" data-opaque="1" title="Toggle lyrics">LYRICS</button>
      <div id="status-overlay" data-opaque="1">
        <div>
          <div class="so-title" id="so-title"></div>
          <div class="so-body" id="so-body"></div>
          <div class="so-actions" id="so-actions"></div>
        </div>
      </div>

      <!-- Spotify sign-in overlay (visible only when not authenticated) -->
      <div id="auth-overlay" data-opaque="1">
        <div class="auth-title">Spotify</div>
        <div class="auth-sub">Sign in to play your library, search, and view what's up next.</div>
        <button id="btn-spotify-signin">Sign in</button>
        <div class="auth-status" id="auth-status-text"></div>
      </div>

      <!-- Now-playing strip -->
      <div id="now-playing"></div>

      <!-- Seek slider -->
      <div id="seek-track">
        <div id="seek-fill"></div>
      </div>

      <!-- Transport -->
      <div id="transport"></div>
      <div id="pause-overlay" hidden></div>

      <!-- Window + drawer controls -->
      <div class="winctl" id="btn-mini-mode" title="Desk buddy mode" data-opaque="1">
        <svg viewBox="0 0 8 8">
          <rect x="2" y="2" width="4" height="4" />
        </svg>
      </div>
      <div class="winctl" id="btn-minimize" title="Minimize" data-opaque="1">
        <svg viewBox="0 0 8 8"><line x1="1" y1="6" x2="7" y2="6" /></svg>
      </div>
      <div class="winctl" id="btn-close" title="Close" data-opaque="1">
        <svg viewBox="0 0 8 8">
          <line x1="1.5" y1="1.5" x2="6.5" y2="6.5" />
          <line x1="6.5" y1="1.5" x2="1.5" y2="6.5" />
        </svg>
      </div>
      <div class="hotzone" id="btn-eq-open" title="Open equalizer"></div>
      <div class="hotzone" id="btn-pl-open" title="Open playlist"></div>

      <canvas id="debug-mask"></canvas>
      <canvas id="face-alive-debug"></canvas>
    </div>
    <script type="module" src="./renderer.ts"></script>
  </body>
</html>
